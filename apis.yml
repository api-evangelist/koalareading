name: 51Talk Koala (koalareading.com)
description: >-
  koalareading.com serves 51Talk考拉外教官网, the marketing landing page for 51Talk's
  "Koala" online English foreign-teacher tutoring product aimed at Chinese K-12
  learners. The site is a single-page property (hero banner plus footer) operated
  by 大生在线（深圳）文化传媒科技有限公司 of Shenzhen under ICP filing 粤ICP备2023085692号, with
  lizhen01@51talk.com published as the technical support contact. The profile
  entered the API Evangelist network as a Qiming Venture Partners portfolio lead
  under the name "koalareading" (考拉阅读 / Koala Reading, a Chinese K-12
  reading-comprehension edtech); the domain as observed on 2026-07-19 serves the
  51Talk Koala product instead, and the relationship between the two is not
  asserted here. As of this enrichment pass the company publishes no public API,
  developer portal, documentation, SDK, CLI, or machine-readable discovery
  surface, so this profile carries only probed evidence.
